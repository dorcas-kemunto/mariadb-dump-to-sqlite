schema_version = "1.3"

[[artifacts]]
source = "/app/"
exclude = ["**/__pycache__/**", "**/*.db", "**/.git/**"]

[task]
name = "dorcas/mariadb-dump-to-sqlite"
description = "Convert college MariaDB backups into SQLite with exact data and working keys"
keywords = ["python", "mariadb", "sqlite", "data-migration", "parsing"]

[metadata]
difficulty = "hard"
category = "data-migration"

[agent]
timeout_sec = 72000
user = "agent"

[verifier]
timeout_sec = 1800
user = "root"
environment_mode = "separate"

[environment]
build_timeout_sec = 900
network_mode = "no-network"
cpus = 2
memory_mb = 4096
storage_mb = 4096
